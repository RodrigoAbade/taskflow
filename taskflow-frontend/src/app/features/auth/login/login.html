
<div class="login-page">

  <header class="page-header">
    <div class="brand">
      <span class="brand-icon">T</span>
      <span class="brand-name">TaskFlow</span>
    </div>

    <div class="preferences">
      <select
        [value]="languageService.language()"
        [attr.aria-label]="languageService.translate('language')"
        (change)="changeLanguage($event)"
      >
        <option value="pt">Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>

      <button
        type="button"
        class="theme-button"
        [attr.aria-label]="languageService.translate('theme')"
        (click)="toggleTheme()"
      >
        @if (themeService.theme() === 'light') {
          <span aria-hidden="true">☾</span>
        } @else {
          <span aria-hidden="true">☀</span>
        }
      </button>
    </div>
  </header>

  <main class="login-container">
    <section class="login-card">

      <div class="login-heading">
        <h1>{{ languageService.translate('welcome') }}</h1>
        <p>{{ languageService.translate('loginSubtitle') }}</p>
      </div>

      <form (submit)="onSubmit($event)">
        <div class="form-group">
          <label for="email">
            {{ languageService.translate('email') }}
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [placeholder]="languageService.translate('emailPlaceholder')"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">
            {{ languageService.translate('password') }}
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [placeholder]="languageService.translate('passwordPlaceholder')"
            autocomplete="current-password"
            required
          />
        </div>

        <button class="submit-button" type="submit">
          {{ languageService.translate('loginButton') }}
        </button>
      </form>

    </section>
  </main>

  <footer class="page-footer">
    {{ languageService.translate('loginFooter') }}
  </footer>

</div>
